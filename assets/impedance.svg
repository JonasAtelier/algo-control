    <path d="M96 182L74 198" fill="none"/>
  </g>
  <text class="lbl" x="70" y="26">wall</text>

  <!-- spring: wall -> mass -->
  <path class="wire" d="M96 78H300"/>
  <path class="wire" d="M300 78l14 -20l14 20l14 -20l14 20l14 -20l14 20l14 -20l14 20l14 -20l14 20l14 -20l14 20"/>
  <path class="wire" d="M468 78H540"/>
  <text class="sml" x="384" y="44" text-anchor="middle">spring k</text>

