  <path class="wire" d="M96 156H386"/>
  <path class="wire" d="M424 132H386V180H424"/>
  <path class="wire" d="M410 138V174"/>
  <path class="wire" d="M410 156H540"/>
  <text class="sml" x="405" y="208" text-anchor="middle">damper b</text>

